# Dota 2 Live Coach settings.
# Copy this file to %APPDATA%\Dota2LiveCoach\coach.toml to override the defaults.

[server]
# The listener only ever binds to this machine. Non-loopback hosts are refused.
host = "127.0.0.1"
port = 4242

[recording]
# Save every GSI update of a match to a .jsonl file, for tests and later review.
enabled = true
# Leave empty to use %APPDATA%\Dota2LiveCoach\recordings
directory = ""

[logging]
# Seconds between one-line state summaries in the console.
summary_interval = 10

[voice]
# "sapi" speaks with Windows' built-in voices; "print" only writes lines to the console.
backend = "sapi"
# Part of an installed voice's name, e.g. "Zira" or "David". Empty = Windows default.
name = ""
# Speaking speed, from -10 (slow) to 10 (fast). 0 is Windows' normal speed.
rate = 1
# Lines that wait longer than this many seconds to be spoken are skipped.
max_delay = 4

[listen]
# Ask the coach questions out loud: say the wake word, wait for the beep, then
# ask, e.g. "what's my next item?", "can I buy back?", "when is the next rune?".
# Needs:  pip install -e ".[voice]"  (the speech models download once, about
# 200 MB). Everything runs on this PC; nothing is recorded or sent anywhere.
# A headset helps, so game sound and Discord don't wake the coach.
# Without those packages the coach just skips listening. Set false to turn it off.
enabled = true
wake_word = "hey coach"
# faster-whisper model: "tiny.en" is lighter on the CPU, "small.en" understands more.
model = "base.en"
# Microphone loudness that counts as talking (raise it if noise keeps it listening).
speech_level = 500
# Longest question, in seconds, and seconds to wait before listening again.
max_seconds = 5
cooldown = 3
# Microphone name or number; empty = Windows default.
device = ""

# Clock reminders. Times are game-clock seconds (6:00 = 360); "lead" is how many
# seconds early to speak. Defaults follow patch 7.41; timings change between
# patches, so adjust them here.
# Set enabled = false to turn one off.
[reminders.power_rune]
first = 360
every = 120
lead = 15

[reminders.bounty_rune]
# Bounty runes are the gold runes: they give gold to your whole team.
first = 240
every = 240
lead = 15

[reminders.wisdom_shrine]
first = 420
every = 420
lead = 20

[reminders.water_rune]
first = 120
every = 120
until = 240
lead = 10

[reminders.stack]
# Pull the camp at about :53 each minute; stops after 11:53. Only said when your
# hero stands within "radius" map units of a neutral camp (patch 7.41 camp spots).
first = 113
every = 60
until = 713
radius = 1000

# Reminders about your own hero. Set enabled = false to turn one off.
[reminders.low_health]
# Said once when health drops under "below" %, again after it climbs over "rearm" %.
below = 25
rearm = 40

[reminders.buyback]
# From this minute on, warn when your gold drops under the buyback cost.
from_minute = 30

[reminders.skill_point]
# Seconds to wait after a level-up before reminding. Not said above max_level.
delay = 10
max_level = 16

[reminders.wand]
# Use Magic Wand/Stick when it has at least min_charges and health is under "below" %.
min_charges = 10
below = 50

[reminders.ward]
# Remind when an observer ward has sat in your inventory this many seconds.
hold_seconds = 60

[reminders.death_tip]
# While you wait to respawn, the coach speaks one short tip based on your own
# hero's stats. Where tips come from:
#   "ollama"  - a free model running on your PC through Ollama (see README)
#   "claude"  - Claude through the paid API (needs ANTHROPIC_API_KEY)
#   "builtin" - free written tips, no AI
# If the model is not running or too slow, a built-in tip is used instead.
enabled = true
provider = "ollama"
ollama_model = "llama3.1:8b"
ollama_url = "http://127.0.0.1:11434"
claude_model = "claude-opus-5-5"
# Claude only: "low" answers fastest.
effort = "low"
# Seconds to wait for the model before falling back to a built-in tip.
timeout = 8
# Only give a tip when the death timer is at least this long.
min_respawn = 10

[reminders.item_ready]
enabled = true

[reminders.power_window]
# Says when the stretches the pre-game briefing found begin: when your lineup
# is strongest and when the enemy's is. "lead" = seconds early.
enabled = true
lead = 10

# The spoken briefing in the countdown before the horn: your team's strengths
# and weaknesses, counters, when to fight, and tips from your own past games.
[pregame]
enabled = true
# "ollama" (free, local model) or "builtin" (written from the facts, no AI).
provider = "ollama"
ollama_model = "llama3.1:8b"
ollama_url = "http://127.0.0.1:11434"
# Seconds to wait for the model before using the built-in briefing.
timeout = 20
# Longest briefing, in words.
words = 70
# Use public hero statistics from OpenDota (counters, win rate by game length).
opendota = true
# Learn from your own recordings (deaths, last hits, item timings).
learn = true
# Also read your own public match history on OpenDota (needs "Expose Public
# Match Data" on in Dota's settings). Other players are never looked up.
my_history = true

[pregame.capture]
# Read the draft from the top bar of the screen. Off by default: when on, the
# coach captures one thin strip at the top of your main monitor just before
# the horn (once more if heroes are missing), reads the ten hero portraits,
# and throws the picture away. Dota must run in borderless window mode.
# You can always type picks instead:  vs am cm lion pudge sf
enabled = false
# Seconds after the countdown starts before the capture.
delay = 2
# Where the portraits are, as fractions of screen height. Check them with
#   py -m coach draft-test <screenshot.png>
top = 0.0046
height = 0.0316
width = 0.0428
step = 0.0576
gap = 0.1018
# How alike a portrait and a hero picture must be (0 to 1). A hero below 0.75
# also has to be clearly ahead of the next best guess.
min_score = 0.5

# Item builds, per hero (the name without npc_dota_hero_). The coach says
# "You have gold for ..." for the first item on the list you don't own yet.
# Use names like "Black King Bar" or GSI keys like "black_king_bar".
# Heroes without their own list use "default_support" if they are a support,
# otherwise "default". An empty list (pudge = []) turns the reminder off for
# that hero.
#
# These are simple, forgiving builds for heroes popular from Herald to Ancient.
# Don't list an item and then its upgrade (Dragon Lance, then Hurricane Pike):
# the coach cannot tell the first one was built into the second.
# Some keys differ from the hero's name: Wraith King is skeleton_king and Zeus
# is zuus.
[builds]
default = ["Power Treads", "Black King Bar", "Satanic"]
default_support = ["Arcane Boots", "Glimmer Cape", "Force Staff", "Aghanim's Scepter"]
axe = ["Phase Boots", "Blink Dagger", "Blade Mail", "Black King Bar", "Assault Cuirass"]
bristleback = ["Phase Boots", "Vanguard", "Black King Bar", "Assault Cuirass", "Heart of Tarrasque"]
drow_ranger = ["Power Treads", "Hurricane Pike", "Manta Style", "Black King Bar", "Daedalus"]
juggernaut = ["Phase Boots", "Battle Fury", "Manta Style", "Black King Bar", "Butterfly"]
legion_commander = ["Phase Boots", "Blade Mail", "Blink Dagger", "Black King Bar", "Assault Cuirass"]
lion = ["Tranquil Boots", "Blink Dagger", "Aether Lens", "Glimmer Cape", "Aghanim's Scepter"]
luna = ["Power Treads", "Mask of Madness", "Manta Style", "Black King Bar", "Butterfly"]
ogre_magi = ["Arcane Boots", "Hand of Midas", "Aghanim's Scepter", "Glimmer Cape", "Force Staff"]
phantom_assassin = ["Power Treads", "Battle Fury", "Desolator", "Black King Bar", "Abyssal Blade"]
pudge = ["Tranquil Boots", "Blink Dagger", "Aghanim's Shard", "Spirit Vessel", "Heart of Tarrasque"]
skeleton_king = ["Phase Boots", "Armlet of Mordiggian", "Blink Dagger", "Black King Bar", "Assault Cuirass"]
slark = ["Power Treads", "Diffusal Blade", "Black King Bar", "Eye of Skadi", "Abyssal Blade"]
sniper = ["Power Treads", "Maelstrom", "Hurricane Pike", "Black King Bar", "Daedalus"]
viper = ["Power Treads", "Hurricane Pike", "Black King Bar", "Eye of Skadi", "Butterfly"]
witch_doctor = ["Arcane Boots", "Glimmer Cape", "Aghanim's Scepter", "Force Staff", "Aether Lens"]
zuus = ["Arcane Boots", "Kaya", "Aghanim's Scepter", "Aether Lens", "Octarine Core"]

[project]
name = "dota2-live-coach"
version = "0.1.0"
description = "A rule-safe Dota 2 voice coach for Windows, built on Valve's Game State Integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "anthropic>=2.0",
    "comtypes>=1.2; sys_platform == 'win32'",
    "numpy>=1.26",
    # Screen frames for replay review only (coach/vision.py).
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-aiohttp>=1.0"]
# Hands-free questions ("hey coach, what's my next item?"), all on this PC.
voice = ["faster-whisper>=1.0", "sounddevice>=0.4.6", "vosk>=0.3.45"]
# The app window (py -m coach app): a page in Windows' own WebView2.
app = ["pywebview>=5.4"]
# Builds the Windows app folder: py packaging/build_exe.py
build = ["pyinstaller>=6.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coach", "coach.rules"]

[tool.setuptools.package-data]
coach = ["data/*.json", "ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

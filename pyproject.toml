[project]
name = "dota2-live-coach"
version = "0.1.0"
description = "A rule-safe Dota 2 voice coach for Windows, built on Valve's Game State Integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-aiohttp>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
